name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Spelling
        run: npx --yes -p cspell -p @cspell/dict-en-au cspell --no-progress "**/*.md"

      - name: Python compiles
        run: python -m compileall -q scripts .agents/skills/canva-sync/scripts .agents/skills/get-nesa-grading-rules/scripts

      - name: Canva sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Canva sync doctor (fixture deck)
        run: python .agents/skills/canva-sync/scripts/canva_sync.py doctor --config .agents/skills/canva-sync/assets/fixtures/mini-deck/canva.config.json

      - name: Canva sync selftest
        run: python .agents/skills/canva-sync/scripts/canva_sync.py selftest --config .agents/skills/canva-sync/assets/fixtures/mini-deck/canva.config.json
